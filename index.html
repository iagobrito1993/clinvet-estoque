<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Clinvet Estoque</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f5c56'/><path d='M28 16h8v12h12v8H36v12h-8V36H16v-8h12z' fill='white'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16201e;--mut:#62706c;--line:#dfe5e3;--pri:#0f5c56;--pri2:#0b4642;--red:#b42318;--amb:#b54708;--ok:#067647;--blue:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 90px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:500}
button:hover{border-color:#c4ccc9}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover{background:var(--pri2)}
button.danger{color:var(--red);border-color:#f3c9c4}
button.small{padding:5px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--pri);padding:0;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:54px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #8cc7bf;border-color:transparent}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
.hidden{display:none!important}
.topo{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.marca .ic{width:34px;height:34px;border-radius:9px;background:var(--pri);display:grid;place-items:center}
.marca small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.quem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);flex-wrap:wrap;justify-content:flex-end}
.abas{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px}
.abas button{white-space:nowrap;border-radius:99px;padding:7px 14px}
.abas button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.barra input,.barra select{flex:1;min-width:160px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:default}
.kpi.cl{cursor:pointer}.kpi.cl:hover{border-color:var(--pri)}
.kpi .n{font-size:21px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi.red .n{color:var(--red)}.kpi.amb .n{color:var(--amb)}
.lista{display:flex;flex-direction:column;gap:7px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.item.cl{cursor:pointer}.item.cl:hover{border-color:#b9c4c1}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--mut)}
.item .q{text-align:right;white-space:nowrap}
.item .q b{font-size:18px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#eef2f1;color:var(--mut);margin-right:4px}
.tag.red{background:#fde8e6;color:var(--red)}.tag.amb{background:#fef0dc;color:var(--amb)}.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.blue{background:#e5ecfd;color:var(--blue)}
.painel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.painel h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.motivos{display:flex;gap:6px;flex-wrap:wrap}
.motivos button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:6px}
.tabela td{border-bottom:1px solid #eef1f0;padding:7px 6px;vertical-align:top}
.tabela td.n,.tabela th.n{text-align:right;white-space:nowrap}
.busca{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:20;max-height:300px;overflow:auto}
.sug div{padding:8px 11px;cursor:pointer;border-bottom:1px solid #f0f2f1;font-size:14px}
.sug div:hover,.sug div.on{background:#eef6f5}
.sug small{color:var(--mut)}
.fundo{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:30;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;padding:18px}
.modal h3{margin:0 0 14px}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.vazio{color:var(--mut);text-align:center;padding:26px;background:#fff;border:1px dashed var(--line);border-radius:12px}
.aviso{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:90vw}
.aviso.erro{background:var(--red)}
.login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.login h2{margin:6px 0 16px}
.mut{color:var(--mut);font-size:13px}
.linha{display:flex;gap:8px;align-items:end}
.linha>*{flex:1}
@media (max-width:640px){.g2{grid-template-columns:1fr}.item{flex-wrap:wrap}.tabela{font-size:13px}.esc-m{display:none}}
</style>
</head>
<body>
<div id="tela_login" class="hidden">
  <div class="login">
    <div class="marca"><div class="ic"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M28 12h8v16h16v8H36v16h-8V36H12v-8h16z" fill="#fff"/></svg></div><div>Clinvet<small>Controle de estoque</small></div></div>
    <h2 id="l_tit">Entrar</h2>
    <div id="l_nome_box" class="hidden" style="margin-bottom:10px"><label>Nome</label><input id="l_nome" autocomplete="name"></div>
    <div style="margin-bottom:10px"><label>E-mail</label><input id="l_email" type="email" autocomplete="email"></div>
    <div id="l_senha_box" style="margin-bottom:14px"><label>Senha</label><input id="l_senha" type="password" autocomplete="current-password"></div>
    <button class="primary" style="width:100%" id="l_btn">Entrar</button>
    <p class="mut" style="margin-top:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <button class="link" id="l_troca">Criar conta</button>
      <button class="link" id="l_esqueci">Esqueci a senha</button>
    </p>
  </div>
</div>

<div id="tela_pendente" class="hidden">
  <div class="login"><h2>Aguardando liberação</h2><p>Sua conta foi criada. O administrador da Clinvet precisa liberar o seu acesso.</p><button id="p_sair">Sair</button></div>
</div>

<div id="tela_app" class="hidden">
  <div class="topo"><div class="wrap">
    <div class="marca"><div class="ic"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M28 12h8v16h16v8H36v16h-8V36H12v-8h16z" fill="#fff"/></svg></div><div>Clinvet<small>Controle de estoque</small></div></div>
    <div class="quem"><span id="u_nome"></span><span class="tag" id="u_papel"></span><button class="small" id="b_sair">Sair</button></div>
  </div></div>
  <div class="wrap">
    <div class="abas" id="abas"></div>
    <div id="conteudo"></div>
  </div>
</div>

<div id="modal_box"></div>
<div id="aviso" class="aviso hidden"></div>

<script>
const SUPABASE_URL='https://acvrnfgnkrjnwlcyeqnt.supabase.co';
const SUPABASE_KEY='sb_publishable_TSm6WirsEAN_GRgEfb1BGw_aYQK2twk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n};
const numIn=v=>{if(v===''||v==null)return null;let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isNaN(n)?null:n};
const fq=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const fm=n=>n==null?'—':Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=d=>d?new Date(d+(d.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR'):'—';
const fdh=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const hoje=()=>new Date().toISOString().slice(0,10);
const diasAte=d=>d?Math.round((new Date(d+'T12:00:00')-new Date(hoje()+'T12:00:00'))/864e5):null;
const chave=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function aviso(t,erro){const a=$('aviso');a.textContent=t;a.className='aviso'+(erro?' erro':'');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.add('hidden'),erro?6000:3000)}
function erroMsg(e){const m=e?.message||String(e);if(/Invalid login/i.test(m))return'E-mail ou senha incorretos';if(/Email not confirmed/i.test(m))return'Confirme seu e-mail pelo link que enviamos';if(/already registered/i.test(m))return'Este e-mail já tem conta. Use Entrar.';return m}

const MOTIVOS={compra:'Compra',doacao:'Doação / bonificação',devolucao:'Devolução',uso_atendimento:'Uso em atendimento',venda:'Venda',perda:'Perda / avaria',vencimento:'Vencimento',ajuste_mais:'Ajuste (+)',ajuste_menos:'Ajuste (−)',estorno:'Estorno'};
const COR_MOT={compra:'ok',doacao:'ok',devolucao:'ok',uso_atendimento:'blue',venda:'amb',perda:'red',vencimento:'red',ajuste_mais:'',ajuste_menos:'',estorno:''};
const PAPEIS={admin:'Administrador',estoque:'Estoque',atendimento:'Atendimento',pendente:'Pendente'};

let eu=null, papel='pendente', aba='estoque';
let produtos=[], categorias=[], fornecedores=[];
const isAdmin=()=>papel==='admin', podeEntrada=()=>papel==='admin'||papel==='estoque';

// ===== LOGIN =====
let modoCad=false;
function telaLogin(){
  ['tela_app','tela_pendente'].forEach(i=>$(i).classList.add('hidden'));$('tela_login').classList.remove('hidden');
}
$('l_troca').onclick=()=>{modoCad=!modoCad;$('l_tit').textContent=modoCad?'Criar conta':'Entrar';$('l_btn').textContent=modoCad?'Criar conta':'Entrar';$('l_troca').textContent=modoCad?'Já tenho conta':'Criar conta';$('l_nome_box').classList.toggle('hidden',!modoCad);$('l_senha').autocomplete=modoCad?'new-password':'current-password'};
$('l_btn').onclick=async()=>{
  const email=$('l_email').value.trim().toLowerCase();if(!email)return aviso('Informe o e-mail',1);
  $('l_btn').disabled=true;
  try{
    if(modoCad){
      if($('l_senha').value.length<6)throw new Error('A senha precisa ter pelo menos 6 caracteres');
      const {data,error}=await sb.auth.signUp({email,password:$('l_senha').value,options:{data:{nome:$('l_nome').value.trim()},emailRedirectTo:location.origin+location.pathname}});
      if(error)throw error;
      if(!data.session)aviso('Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.');
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:$('l_senha').value});if(error)throw error;
    }
  }catch(e){aviso(erroMsg(e),1)}finally{$('l_btn').disabled=false}
};
$('l_esqueci').onclick=async()=>{const email=$('l_email').value.trim();if(!email)return aviso('Digite seu e-mail primeiro',1);
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return aviso(erroMsg(error),1);aviso('Enviamos um link para redefinir a senha')};
$('b_sair').onclick=$('p_sair').onclick=async()=>{await sb.auth.signOut();location.reload()};

sb.auth.onAuthStateChange(async(ev,ses)=>{
  if(ev==='PASSWORD_RECOVERY'){const n=prompt('Digite a nova senha (mínimo 6 caracteres):');if(n&&n.length>=6){const {error}=await sb.auth.updateUser({password:n});aviso(error?erroMsg(error):'Senha alterada',!!error)}}
  if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT'){ses?iniciar(ses.user):telaLogin()}
});

async function iniciar(user){
  if(eu&&eu.id===user.id)return;
  eu=user;
  const {data:p}=await sb.from('perfis').select('*').eq('id',user.id).maybeSingle();
  papel=p?.papel||'pendente';
  $('tela_login').classList.add('hidden');
  if(papel==='pendente'){$('tela_pendente').classList.remove('hidden');return}
  $('tela_app').classList.remove('hidden');
  $('u_nome').textContent=p?.nome||user.email;$('u_papel').textContent=PAPEIS[papel];
  await carregarBase();
  montarAbas();ir(location.hash.slice(1)||'estoque');
}
window.addEventListener('hashchange',()=>{const a=location.hash.slice(1);if(a&&a!==aba)ir(a)});

async function carregarBase(){
  const [pr,ca,fo]=await Promise.all([
    sb.from('v_estoque').select('*').order('nome').limit(5000),
    sb.from('categorias').select('nome').order('nome'),
    podeEntrada()?sb.from('fornecedores').select('*').order('nome'):Promise.resolve({data:[]})
  ]);
  if(pr.error)aviso(pr.error.message,1);
  produtos=pr.data||[];categorias=(ca.data||[]).map(c=>c.nome);fornecedores=fo.data||[];
}
const prod=id=>produtos.find(p=>p.id===id);

function abasVisiveis(){
  const a=[['estoque','Estoque'],['saida','Saída'],];
  if(podeEntrada())a.push(['entrada','Entrada']);
  a.push(['validade','Validades'],['movs','Movimentações']);
  if(isAdmin())a.push(['relatorio','Relatórios']);
  if(podeEntrada())a.push(['produtos','Produtos']);
  if(isAdmin())a.push(['usuarios','Usuários']);
  return a;
}
function montarAbas(){$('abas').innerHTML=abasVisiveis().map(([k,t])=>`<button data-a="${k}">${t}</button>`).join('');
  $('abas').querySelectorAll('button').forEach(b=>b.onclick=()=>ir(b.dataset.a))}
function ir(a){
  if(!abasVisiveis().some(x=>x[0]===a))a='estoque';
  aba=a;if(location.hash.slice(1)!==a)history.replaceState(null,'','#'+a);
  $('abas').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
  ({estoque:telaEstoque,saida:telaSaida,entrada:telaEntrada,validade:telaValidade,movs:telaMovs,relatorio:telaRelatorio,produtos:telaProdutos,usuarios:telaUsuarios})[a]();
}

// ===== MODAL =====
function modal(html){$('modal_box').innerHTML=`<div class="fundo" id="fundo"><div class="modal">${html}</div></div>`;$('fundo').onclick=e=>{if(e.target.id==='fundo')fecharModal()}}
function fecharModal(){$('modal_box').innerHTML=''}

// ===== BUSCA DE PRODUTO (nome ou código de barras / leitor) =====
function buscaProduto(inputId,aoEscolher,filtro){
  const inp=$(inputId);const box=document.createElement('div');box.className='sug hidden';inp.parentNode.appendChild(box);
  let lista=[],sel=0;
  const achar=t=>{t=t.trim().toLowerCase();if(!t)return[];
    const ex=produtos.filter(p=>p.ativo&&(p.codigo_barras===t||String(p.codigo||'').toLowerCase()===t));if(ex.length)return ex;
    const pal=t.split(/\s+/);return produtos.filter(p=>p.ativo&&(!filtro||filtro(p))&&pal.every(w=>(p.nome+' '+(p.codigo||'')+' '+(p.codigo_barras||'')+' '+(p.apresentacao||'')).toLowerCase().includes(w))).slice(0,30)};
  const desenhar=()=>{if(!lista.length){box.innerHTML=inp.value.trim()?`<div class="mut">Nenhum produto encontrado${podeEntrada()?' — <b>+ cadastrar “'+esc(inp.value.trim())+'”</b>':''}</div>`:'';box.classList.toggle('hidden',!inp.value.trim());
      const d=box.firstChild;if(d&&podeEntrada())d.onmousedown=e=>{e.preventDefault();box.classList.add('hidden');editarProduto(null,inp.value.trim(),p=>{inp.value='';aoEscolher(p)})};return}
    box.innerHTML=lista.map((p,i)=>`<div data-i="${i}" class="${i===sel?'on':''}"><b>${esc(p.nome)}</b> <small>${esc(p.apresentacao||'')} · saldo ${fq(p.saldo)} ${esc(p.unidade)}${p.codigo_barras?' · '+esc(p.codigo_barras):''}</small></div>`).join('');
    box.classList.remove('hidden');box.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=e=>{e.preventDefault();escolher(lista[+d.dataset.i])})};
  const escolher=p=>{box.classList.add('hidden');inp.value='';aoEscolher(p)};
  inp.oninput=()=>{lista=achar(inp.value);sel=0;desenhar()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,lista.length-1);desenhar();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);desenhar();e.preventDefault()}
    else if(e.key==='Enter'){e.preventDefault();lista=achar(inp.value);if(lista.length)escolher(lista[Math.min(sel,lista.length-1)]);else desenhar()}else if(e.key==='Escape')box.classList.add('hidden')};
  inp.onblur=()=>setTimeout(()=>box.classList.add('hidden'),150);
}

// ===== ESTOQUE =====
let filtroEst={t:'',cat:'',alerta:''};
function alertasProd(p){
  const r=[];const d=diasAte(p.prox_validade);
  if(p.saldo<=0)r.push(['zerado','Sem estoque','red']);
  else if(p.estoque_minimo>0&&p.saldo<=p.estoque_minimo)r.push(['minimo','Abaixo do mínimo','amb']);
  if(d!=null&&d<0)r.push(['vencido','Lote vencido','red']);else if(d!=null&&d<=30)r.push(['vence30','Vence em '+d+'d','amb']);else if(d!=null&&d<=60)r.push(['vence60','Vence em '+d+'d','']);
  return r;
}
function telaEstoque(){
  const at=produtos.filter(p=>p.ativo);
  const nMin=at.filter(p=>p.estoque_minimo>0&&p.saldo<=p.estoque_minimo).length;
  const nVenc=at.filter(p=>{const d=diasAte(p.prox_validade);return d!=null&&d<0}).length;
  const n30=at.filter(p=>{const d=diasAte(p.prox_validade);return d!=null&&d>=0&&d<=30}).length;
  const valor=at.reduce((s,p)=>s+Math.max(p.saldo,0)*(p.custo_medio||0),0);
  $('conteudo').innerHTML=`
  <div class="resumo">
    <div class="kpi cl" data-f=""><div class="n">${at.filter(p=>p.saldo>0).length}</div><div class="l">Produtos com estoque</div></div>
    <div class="kpi cl amb" data-f="minimo"><div class="n">${nMin}</div><div class="l">No mínimo / repor</div></div>
    <div class="kpi cl amb" data-f="vence30"><div class="n">${n30}</div><div class="l">Vencem em 30 dias</div></div>
    <div class="kpi cl red" data-f="vencido"><div class="n">${nVenc}</div><div class="l">Com lote vencido</div></div>
    ${isAdmin()?`<div class="kpi"><div class="n">${fm(valor)}</div><div class="l">Valor em estoque (custo)</div></div>`:''}
  </div>
  <div class="barra">
    <input id="e_busca" placeholder="Buscar por nome, código ou leitor de código de barras" value="${esc(filtroEst.t)}">
    <select id="e_cat" style="max-width:220px"><option value="">Todas as categorias</option>${categorias.map(c=>`<option ${c===filtroEst.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <select id="e_al" style="max-width:200px"><option value="">Todos</option><option value="minimo">Abaixo do mínimo</option><option value="vence30">Vencem em 30 dias</option><option value="vencido">Lote vencido</option><option value="zerado">Sem estoque</option><option value="com">Com estoque</option></select>
  </div>
  <div class="lista" id="e_lista"></div>`;
  $('e_al').value=filtroEst.alerta;
  const lista=()=>{
    const t=filtroEst.t.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const r=at.filter(p=>{
      if(filtroEst.cat&&p.categoria!==filtroEst.cat)return false;
      if(t.length&&!t.every(w=>(p.nome+' '+(p.codigo||'')+' '+(p.codigo_barras||'')+' '+(p.apresentacao||'')).toLowerCase().includes(w)))return false;
      const a=alertasProd(p).map(x=>x[0]);
      if(filtroEst.alerta==='minimo')return a.includes('minimo')||(p.estoque_minimo>0&&p.saldo<=p.estoque_minimo);
      if(filtroEst.alerta==='vence30')return a.includes('vence30');
      if(filtroEst.alerta==='vencido')return a.includes('vencido');
      if(filtroEst.alerta==='zerado')return p.saldo<=0;
      if(filtroEst.alerta==='com')return p.saldo>0;
      return true});
    $('e_lista').innerHTML=r.length?r.slice(0,400).map(p=>`<div class="item cl" data-id="${p.id}">
      <div><div class="t">${esc(p.nome)}${p.controlado?' <span class="tag red">Controlado</span>':''}</div>
      <div class="s">${esc(p.categoria||'Sem categoria')}${p.apresentacao?' · '+esc(p.apresentacao):''}${p.estoque_minimo?' · mín. '+fq(p.estoque_minimo):''}${p.preco_venda?' · venda '+fm(p.preco_venda):''}${isAdmin()&&p.custo_medio?' · custo '+fm(p.custo_medio):''}</div>
      <div style="margin-top:4px">${alertasProd(p).map(a=>`<span class="tag ${a[2]}">${a[1]}</span>`).join('')}${p.prox_validade&&diasAte(p.prox_validade)>60?`<span class="tag">Val. ${fd(p.prox_validade)}</span>`:''}</div></div>
      <div class="q"><b>${fq(p.saldo)}</b> <span class="mut">${esc(p.unidade)}</span></div></div>`).join('')+(r.length>400?`<p class="mut">Mostrando 400 de ${r.length}. Refine a busca.</p>`:''):`<div class="vazio">${produtos.length?'Nenhum produto neste filtro.':'Nenhum produto cadastrado ainda. '+(podeEntrada()?'Comece pela aba <b>Entrada</b> ou <b>Produtos</b>.':'')}</div>`;
    $('e_lista').querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>verProduto(+d.dataset.id));
  };
  $('e_busca').oninput=e=>{filtroEst.t=e.target.value;lista()};
  $('e_busca').onkeydown=e=>{if(e.key==='Enter'){const p=produtos.find(x=>x.codigo_barras&&x.codigo_barras===e.target.value.trim());if(p)verProduto(p.id)}};
  $('e_cat').onchange=e=>{filtroEst.cat=e.target.value;lista()};
  $('e_al').onchange=e=>{filtroEst.alerta=e.target.value;lista()};
  document.querySelectorAll('.kpi.cl').forEach(k=>k.onclick=()=>{filtroEst.alerta=k.dataset.f;$('e_al').value=k.dataset.f;lista()});
  lista();$('e_busca').focus();
}

  $('vp_f').onclick=fecharModal;$('vp_saida').onclick=()=>{fecharModal();ir('saida');addSaida(p)};

  const [l,m]=await Promise.all([sb.from('lotes').select('*').eq('produto_id',id).order('validade',{nullsFirst:false}),sb.from('movimentos').select('*').eq('produto_id',id).order('criado_em',{ascending:false}).limit(15)]);

  $('vp_lotes').querySelectorAll('[data-aj]').forEach(b=>b.onclick=async()=>{

function telaSaida(){

    <div id="s_atend" class="grid" style="margin-top:12px">
      <div><label>Paciente (animal)</label><input id="s_pac" placeholder="Ex.: Thor"></div>
      <div><label>Tutor</label><input id="s_tut"></div>

  </div>`;
  $('s_mot').querySelectorAll('button').forEach(b=>b.onclick=()=>{motivoSaida=b.dataset.m;telaSaida()});
  $('s_atend').classList.toggle('hidden',!['uso_atendimento','venda'].includes(motivoSaida));
  buscaProduto('s_prod',p=>addSaida(p));
  $('s_limpar').onclick=()=>{carrSaida=[];desenharSaida()};
  $('s_ok').onclick=confirmarSaida;
  desenharSaida();$('s_prod').focus();

async function addSaida(p){
  const ex=carrSaida.find(i=>i.p.id===p.id&&!i.lote);if(ex){ex.qtd+=1;desenharSaida();return}
  const it={p,qtd:1,lote:'',valor:p.preco_venda||'',lotes:[]};carrSaida.push(it);desenharSaida();
  const {data}=await sb.from('lotes').select('*').eq('produto_id',p.id).gt('saldo',0).order('validade',{nullsFirst:false});it.lotes=data||[];desenharSaida();
}
function desenharSaida(){
  const box=$('s_itens');if(!box)return;
  const venda=motivoSaida==='venda';
  if(!carrSaida.length){box.innerHTML='<div class="vazio">Nenhum produto adicionado.</div>';return}
  let tot=0;
  box.innerHTML=`<table class="tabela"><tr><th>Produto</th><th>Lote</th><th class="n">Qtd</th>${venda?'<th class="n">Valor un.</th>':''}<th></th></tr>${carrSaida.map((i,k)=>{if(venda)tot+=(numIn(i.valor)||0)*(numIn(i.qtd)||0);
    return`<tr><td><b>${esc(i.p.nome)}</b><div class="mut">saldo ${fq(i.p.saldo)} ${esc(i.p.unidade)}</div></td>
    <td><select data-k="${k}" data-c="lote" style="min-width:150px"><option value="">Automático (vence primeiro)</option>${i.lotes.map(l=>`<option value="${l.id}" ${String(l.id)===String(i.lote)?'selected':''}>${esc(l.lote)} · ${fd(l.validade)} · ${fq(l.saldo)}</option>`).join('')}</select></td>
    <td class="n"><input data-k="${k}" data-c="qtd" value="${i.qtd}" inputmode="decimal" style="width:80px;text-align:right"></td>
    ${venda?`<td class="n"><input data-k="${k}" data-c="valor" value="${i.valor}" inputmode="decimal" style="width:100px;text-align:right"></td>`:''}
    <td class="n"><button class="small danger" data-rm="${k}">✕</button></td></tr>`}).join('')}</table>${venda?`<p style="text-align:right"><b>Total da venda: ${fm(tot)}</b></p>`:''}`;
  box.querySelectorAll('[data-c]').forEach(e=>e.onchange=()=>{carrSaida[+e.dataset.k][e.dataset.c]=e.value;desenharSaida()});
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{carrSaida.splice(+b.dataset.rm,1);desenharSaida()});
}
async function confirmarSaida(){
  if(!carrSaida.length)return aviso('Adicione pelo menos um produto',1);
  for(const i of carrSaida){const q=numIn(i.qtd);if(!q||q<=0)return aviso('Quantidade inválida em '+i.p.nome,1)}
  const btn=$('s_ok');btn.disabled=true;
  const base={p_motivo:motivoSaida,p_paciente:$('s_pac')?.value.trim()||null,p_tutor:$('s_tut')?.value.trim()||null,p_veterinario:$('s_vet')?.value.trim()||null,p_obs:$('s_obs').value.trim()||null};
  if(!['uso_atendimento','venda'].includes(motivoSaida)){base.p_paciente=base.p_tutor=base.p_veterinario=null}
  const falhas=[];
  for(const i of [...carrSaida]){
    i.ch=i.ch||chave();
    const {error}=await sb.rpc('registrar_saida',{...base,p_produto:i.p.id,p_qtd:numIn(i.qtd),p_lote:i.lote?+i.lote:null,p_valor:motivoSaida==='venda'?numIn(i.valor):null,p_chave:i.ch});
    if(error)falhas.push(i.p.nome+': '+error.message);else carrSaida=carrSaida.filter(x=>x!==i);
  }
  btn.disabled=false;await carregarBase();
  if(falhas.length){aviso(falhas.join(' | '),1);desenharSaida()}else{aviso('Saída registrada');telaSaida()}
}

async function telaValidade(){
  $('conteudo').innerHTML='<p class="mut">Carregando…</p>';
  const {data,error}=await sb.from('v_lotes').select('*').not('validade','is',null).order('validade').limit(2000);
  if(error)return aviso(error.message,1);
  let dias=window._vd||90;
  const desenhar=()=>{
    const r=(data||[]).filter(l=>l.dias<=dias);
    const venc=r.filter(l=>l.dias<0),v30=r.filter(l=>l.dias>=0&&l.dias<=30);
    $('conteudo').innerHTML=`<div class="resumo"><div class="kpi red"><div class="n">${venc.length}</div><div class="l">Lotes vencidos</div></div><div class="kpi amb"><div class="n">${v30.length}</div><div class="l">Vencem em até 30 dias</div></div>${isAdmin()?`<div class="kpi"><div class="n">${fm(r.reduce((s,l)=>s+l.saldo*(l.custo_medio||0),0))}</div><div class="l">Valor em risco (custo)</div></div>`:''}</div>

    $('v_d').onchange=e=>{dias=window._vd=+e.target.value;desenhar()};
    document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Dar baixa de '+fq(b.dataset.s)+' unidades deste lote como vencimento?'))return;
      const {error}=await sb.rpc('registrar_saida',{p_produto:+b.dataset.p,p_qtd:+b.dataset.s,p_motivo:'vencimento',p_lote:+b.dataset.b,p_chave:chave()});

  };desenhar();
}

  const carregar=async()=>{
    let q=sb.from('movimentos').select('*').order('criado_em',{ascending:false}).limit(3000);
    if(fMov.de)q=q.gte('criado_em',fMov.de+'T00:00:00-03:00');if(fMov.ate)q=q.lte('criado_em',fMov.ate+'T23:59:59-03:00');if(fMov.mot)q=q.eq('motivo',fMov.mot);
    const {data,error}=await q;if(error)return aviso(error.message,1);dados=data||[];desenhar()};
  const filtrados=()=>{const t=fMov.t.trim().toLowerCase();return t?dados.filter(m=>((prod(m.produto_id)?.nome||'')+' '+(m.paciente||'')+' '+(m.tutor||'')).toLowerCase().includes(t)):dados};
  const desenhar=()=>{const r=filtrados();
    $('m_lista').innerHTML=r.length?`<div class="painel" style="padding:8px 12px;overflow-x:auto"><table class="tabela"><tr><th>Data</th><th>Produto</th><th>Tipo</th><th class="n">Qtd</th>${isAdmin()?'<th class="n">Valor</th>':''}<th class="esc-m">Detalhe</th><th class="esc-m">Por</th>${isAdmin()?'<th></th>':''}</tr>${r.slice(0,600).map(m=>{
      const ent=m.tipo==='entrada'||m.motivo==='ajuste_mais';const sinal=m.motivo==='estorno'?'↺':ent?'+':'−';
      const val=m.motivo==='venda'?(m.valor_unit||0)*m.quantidade:(m.custo_unit||0)*m.quantidade;
      return`<tr style="${m.estornado?'opacity:.5':''}"><td>${fdh(m.criado_em)}</td><td>${esc(prod(m.produto_id)?.nome||'#'+m.produto_id)}</td><td><span class="tag ${COR_MOT[m.motivo]}">${MOTIVOS[m.motivo]}</span>${m.estornado?' <span class="tag">estornado</span>':''}</td>
      <td class="n">${sinal}${fq(m.quantidade)}</td>${isAdmin()?`<td class="n">${val?fm(val):''}</td>`:''}
      <td class="esc-m">${esc([m.paciente&&('Pac.: '+m.paciente),m.tutor&&('Tutor: '+m.tutor),m.veterinario&&('Vet.: '+m.veterinario),m.nota&&('NF '+m.nota),m.obs].filter(Boolean).join(' · '))}</td>
      <td class="esc-m mut">${esc(m.usuario_nome||'')}</td>${isAdmin()?`<td class="n">${!m.estornado&&m.motivo!=='estorno'?`<button class="small" data-e="${m.id}">Estornar</button>`:''}</td>`:''}</tr>`}).join('')}</table>${r.length>600?'<p class="mut">Mostrando 600. Use os filtros.</p>':''}</div>`:'<div class="vazio">Nenhuma movimentação no período.</div>';
    document.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const o=prompt('Motivo do estorno:');if(o==null)return;
      const {error}=await sb.rpc('estornar',{p_mov:+b.dataset.e,p_obs:o});if(error)return aviso(error.message,1);aviso('Lançamento estornado');await carregarBase();carregar()});
  };
  if($('m_csv'))$('m_csv').onclick=()=>{const r=filtrados();const linhas=[['Data','Produto','Categoria','Tipo','Quantidade','Unidade','Custo un.','Valor venda un.','Paciente','Tutor','Veterinário','NF','Obs','Usuário','Estornado']];
    r.forEach(m=>{const p=prod(m.produto_id)||{};linhas.push([fdh(m.criado_em),p.nome,p.categoria,MOTIVOS[m.motivo],String(m.quantidade).replace('.',','),p.unidade,m.custo_unit!=null?String(m.custo_unit).replace('.',','):'',m.valor_unit!=null?String(m.valor_unit).replace('.',','):'',m.paciente,m.tutor,m.veterinario,m.nota,m.obs,m.usuario_nome,m.estornado?'sim':''])});
    const csv='﻿'+linhas.map(l=>l.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='clinvet-movimentacoes.csv';a.click()};
  carregar();
}

// ===== RELATÓRIOS =====
async function telaRelatorio(){
  const d=new Date();const ini=window._rIni||new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);const fim=window._rFim||hoje();
  $('conteudo').innerHTML=`<div class="barra"><span class="mut">Período</span><input type="date" id="r_de" value="${ini}" style="max-width:160px"><input type="date" id="r_ate" value="${fim}" style="max-width:160px"></div><div id="r_c"><p class="mut">Carregando…</p></div>`;
  $('r_de').onchange=$('r_ate').onchange=()=>{window._rIni=$('r_de').value;window._rFim=$('r_ate').value;telaRelatorio()};
  const {data,error}=await sb.from('movimentos').select('*').gte('criado_em',ini+'T00:00:00-03:00').lte('criado_em',fim+'T23:59:59-03:00').eq('estornado',false).neq('motivo','estorno').limit(20000);
  if(error)return aviso(error.message,1);
  const s=(f)=>data.filter(f);
  const custo=a=>a.reduce((t,m)=>t+(m.custo_unit||0)*m.quantidade,0);
  const compras=s(m=>m.motivo==='compra'),uso=s(m=>m.motivo==='uso_atendimento'),vend=s(m=>m.motivo==='venda'),perd=s(m=>m.motivo==='perda'||m.motivo==='vencimento');
  const fat=vend.reduce((t,m)=>t+(m.valor_unit||0)*m.quantidade,0),cv=custo(vend);
  const top=(arr)=>{const g={};arr.forEach(m=>{g[m.produto_id]=g[m.produto_id]||{q:0,c:0};g[m.produto_id].q+=Number(m.quantidade);g[m.produto_id].c+=(m.custo_unit||0)*m.quantidade});return Object.entries(g).sort((a,b)=>b[1].c-a[1].c).slice(0,15)};
  const tab=(arr,tit)=>{const t=top(arr);return`<div class="painel"><h3>${tit}</h3>${t.length?`<table class="tabela"><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Custo</th></tr>${t.map(([id,v])=>`<tr><td>${esc(prod(+id)?.nome||id)}</td><td class="n">${fq(v.q)}</td><td class="n">${fm(v.c)}</td></tr>`).join('')}</table>`:'<p class="mut">Nada no período.</p>'}</div>`};
  const valorEst=produtos.reduce((t,p)=>t+Math.max(p.saldo,0)*(p.custo_medio||0),0);
  $('r_c').innerHTML=`<div class="resumo">
    <div class="kpi"><div class="n">${fm(custo(compras))}</div><div class="l">Compras (entradas)</div></div>
    <div class="kpi"><div class="n">${fm(custo(uso))}</div><div class="l">Uso em atendimento (custo)</div></div>
    <div class="kpi"><div class="n">${fm(fat)}</div><div class="l">Vendas (faturado)</div></div>
    <div class="kpi"><div class="n">${fm(fat-cv)}</div><div class="l">Margem nas vendas${fat?' ('+Math.round((fat-cv)/fat*100)+'%)':''}</div></div>
    <div class="kpi red"><div class="n">${fm(custo(perd))}</div><div class="l">Perdas e vencimentos</div></div>
    <div class="kpi"><div class="n">${fm(valorEst)}</div><div class="l">Estoque atual (custo)</div></div>
  </div><div class="g2">${tab(uso,'Mais usados em atendimento')}${tab(vend,'Mais vendidos')}</div>${tab(perd,'Perdas e vencimentos')}`;
}

// ===== PRODUTOS =====
function telaProdutos(){
  $('conteudo').innerHTML=`<div class="barra"><input id="pr_b" placeholder="Buscar produto"><button class="primary" id="pr_novo">+ Novo produto</button>${isAdmin()?'<button id="pr_imp">Importar planilha</button>':''}<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pr_in" style="width:auto"> inativos</label></div><div class="lista" id="pr_l"></div>`;
  const l=()=>{const t=$('pr_b').value.toLowerCase();const ina=$('pr_in').checked;
    const r=produtos.filter(p=>(ina||p.ativo)&&(p.nome+' '+(p.codigo||'')+' '+(p.codigo_barras||'')).toLowerCase().includes(t));
    $('pr_l').innerHTML=r.length?r.slice(0,400).map(p=>`<div class="item cl" data-id="${p.id}"><div><div class="t">${esc(p.nome)} ${p.ativo?'':'<span class="tag">inativo</span>'}</div><div class="s">${esc(p.categoria||'')} · ${esc(p.unidade)}${p.codigo_barras?' · '+esc(p.codigo_barras):''}</div></div><div class="q">${fq(p.saldo)} <span class="mut">${esc(p.unidade)}</span></div></div>`).join(''):'<div class="vazio">Nenhum produto.</div>';
    $('pr_l').querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>editarProduto(prod(+d.dataset.id)))};
  $('pr_b').oninput=l;$('pr_in').onchange=l;$('pr_novo').onclick=()=>editarProduto(null);if($('pr_imp'))$('pr_imp').onclick=importar;l();
}
function editarProduto(p,nomeInicial,depois){
  const v=p||{nome:nomeInicial||'',unidade:'un',estoque_minimo:0,uso:'ambos',ativo:true};
  modal(`<h3>${p?'Editar produto':'Novo produto'}</h3>
  <div class="grid">
    <div style="grid-column:1/-1"><label>Nome</label><input id="p_nome" value="${esc(v.nome)}"></div>
    <div><label>Categoria</label><select id="p_cat"><option value="">—</option>${categorias.map(c=>`<option ${c===v.categoria?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div><label>Apresentação</label><input id="p_apr" value="${esc(v.apresentacao||'')}" placeholder="Ex.: frasco 30 ml"></div>
    <div><label>Unidade de controle</label><select id="p_un">${['un','frasco','ampola','caixa','comprimido','ml','g','kg','dose','pacote','par','rolo'].map(u=>`<option ${u===v.unidade?'selected':''}>${u}</option>`).join('')}</select></div>
    <div><label>Código de barras</label><input id="p_cb" value="${esc(v.codigo_barras||'')}"></div>
    <div><label>Código interno</label><input id="p_cod" value="${esc(v.codigo||'')}"></div>
    <div><label>Estoque mínimo</label><input id="p_min" value="${v.estoque_minimo??0}" inputmode="decimal"></div>
    <div><label>Preço de venda</label><input id="p_pv" value="${v.preco_venda??''}" inputmode="decimal" placeholder="0,00"></div>
    <div><label>Uso</label><select id="p_uso"><option value="ambos">Atendimento e venda</option><option value="interno">Só uso interno</option><option value="venda">Só venda</option></select></div>
    <div style="display:flex;gap:16px;align-items:end"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="p_ctl" style="width:auto" ${v.controlado?'checked':''}> Controlado</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="p_at" style="width:auto" ${v.ativo?'checked':''}> Ativo</label></div>
    <div style="grid-column:1/-1"><label>Observação</label><input id="p_obs" value="${esc(v.obs||'')}"></div>
  </div>
  <div class="acoes"><button id="p_c">Cancelar</button><button class="primary" id="p_ok">Salvar</button></div>`);
  $('p_uso').value=v.uso||'ambos';$('p_c').onclick=fecharModal;$('p_nome').focus();
  $('p_ok').onclick=async()=>{
    const d={nome:$('p_nome').value.trim(),categoria:$('p_cat').value||null,apresentacao:$('p_apr').value.trim()||null,unidade:$('p_un').value,codigo_barras:$('p_cb').value.trim()||null,codigo:$('p_cod').value.trim()||null,estoque_minimo:numIn($('p_min').value)||0,preco_venda:numIn($('p_pv').value),uso:$('p_uso').value,controlado:$('p_ctl').checked,ativo:$('p_at').checked,obs:$('p_obs').value.trim()||null};
    if(!d.nome)return aviso('Informe o nome',1);
    if(d.codigo_barras){const dup=produtos.find(x=>x.codigo_barras===d.codigo_barras&&x.id!==p?.id);if(dup)return aviso('Código de barras já usado em: '+dup.nome,1)}
    const r=p?await sb.from('produtos').update(d).eq('id',p.id).select().single():await sb.from('produtos').insert(d).select().single();
    if(r.error)return aviso(r.error.message,1);
    await carregarBase();fecharModal();aviso('Produto salvo');
    if(depois)depois(prod(r.data.id));else if(aba==='produtos')telaProdutos();else if(aba==='estoque')telaEstoque();
  };
}
// Importação de planilha (CSV com ; ) — cadastra produtos e saldo inicial
function importar(){
  modal(`<h3>Importar planilha de produtos</h3>
  <p class="mut">Salve a planilha como <b>CSV separado por ponto e vírgula</b> com estas colunas, nesta ordem (a 1ª linha é o cabeçalho):<br><code>nome; categoria; apresentacao; unidade; codigo_barras; estoque_minimo; preco_venda; quantidade; custo_unitario; lote; validade (dd/mm/aaaa)</code><br>Produto que já existe (mesmo código de barras ou mesmo nome) recebe só a entrada de saldo.</p>
  <input type="file" id="i_arq" accept=".csv,text/csv"><div id="i_prev" class="mut" style="margin-top:10px"></div>
  <div class="acoes"><button id="i_c">Fechar</button><button class="primary" id="i_ok" disabled>Importar</button></div>`);
  $('i_c').onclick=fecharModal;let linhas=[];
  $('i_arq').onchange=async e=>{const t=await e.target.files[0].text();linhas=t.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim()).slice(1).map(l=>l.split(';').map(c=>c.trim().replace(/^"|"$/g,'')));
    $('i_prev').innerHTML=`${linhas.length} linhas encontradas. Ex.: <b>${esc(linhas[0]?.[0]||'')}</b>`;$('i_ok').disabled=!linhas.length};
  $('i_ok').onclick=async()=>{$('i_ok').disabled=true;let ok=0,er=[];
    for(const [k,c] of linhas.entries()){
      try{const [nome,cat,apr,un,cb,min,pv,qtd,cu,lote,val]=c;if(!nome)continue;
        let p=produtos.find(x=>(cb&&x.codigo_barras===cb)||x.nome.toLowerCase()===nome.toLowerCase());
        if(!p){const r=await sb.from('produtos').insert({nome,categoria:categorias.includes(cat)?cat:(cat||null),apresentacao:apr||null,unidade:un||'un',codigo_barras:cb||null,estoque_minimo:numIn(min)||0,preco_venda:numIn(pv)}).select().single();if(r.error)throw r.error;p={...r.data,saldo:0};produtos.push(p)}
        const q=numIn(qtd);if(q>0){let v=null;if(val){const m=val.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)v=`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;else if(/^\d{4}-\d{2}-\d{2}$/.test(val))v=val}
          const r=await sb.rpc('registrar_entrada',{p_produto:p.id,p_qtd:q,p_lote:lote||null,p_validade:v,p_custo:numIn(cu),p_motivo:'compra',p_obs:'Saldo inicial (importação)'});if(r.error)throw r.error}
        ok++;$('i_prev').textContent=`Importando… ${ok}/${linhas.length}`;
      }catch(e){er.push(`Linha ${k+2}: ${e.message}`)}
    }
    await carregarBase();$('i_prev').innerHTML=`<b>${ok} linhas importadas.</b>${er.length?'<br>Erros:<br>'+er.map(esc).join('<br>'):''}`;
  };
}

// ===== USUÁRIOS =====
async function telaUsuarios(){
  const {data,error}=await sb.from('perfis').select('*').order('criado_em');if(error)return aviso(error.message,1);
  $('conteudo').innerHTML=`<div class="painel"><h3>Usuários</h3><p class="mut" style="margin-top:-6px">Quem cria conta no site entra como <b>Pendente</b> até você liberar.<br><b>Administrador</b>: tudo, inclusive custos, relatórios, ajustes e estornos. <b>Estoque</b>: entradas, saídas, cadastros. <b>Atendimento</b>: só consulta e lança uso em atendimento ou venda.</p>
  <table class="tabela"><tr><th>Nome</th><th>E-mail</th><th>Acesso</th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.nome||'')}</td><td>${esc(u.email)}</td><td><select data-u="${u.id}" ${u.id===eu.id?'disabled':''} style="max-width:180px">${Object.entries(PAPEIS).map(([k,v])=>`<option value="${k}" ${k===u.papel?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`;
  document.querySelectorAll('[data-u]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('perfis').update({papel:s.value}).eq('id',s.dataset.u);aviso(error?error.message:'Acesso atualizado',!!error)});
}
